#config-version=FGT100F-7.4.4
config vdom
edit root
next
edit DMZ-VD
next
end
config global
config system global
    set hostname fgt-core
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 198.18.0.1 255.255.255.0
        set alias "wan"
        set description "Internet uplink"
    next
    edit "port2"
        set vdom "root"
        set ip 10.70.0.1 255.255.0.0
        set alias "lan"
    next
    edit "vlan300"
        set vdom "DMZ-VD"
        set interface "port3"
        set vlanid 300
        set ip 172.20.30.1 255.255.255.0
    next
    edit "agg1"
        set vdom "root"
        set type aggregate
        set member "port5" "port6"
        set ip 10.80.0.1 255.255.255.0
    next
end
config system ha
    set mode a-p
    set group-name "fgt-ha"
end
end
config vdom
edit root
config system zone
    edit "Z-WAN"
        set interface "port1"
    next
    edit "Z-LAN"
        set interface "port2" "agg1"
    next
end
config firewall address
    edit "SRV-MAIL"
        set subnet 10.70.5.25 255.255.255.255
    next
    edit "NET-BRANCH"
        set subnet 10.90.0.0 255.255.0.0
        set comment "Branch offices"
    next
    edit "POOL-RANGE"
        set type iprange
        set start-ip 198.18.0.10
        set end-ip 198.18.0.20
    next
    edit "FQDN-CRM"
        set type fqdn
        set fqdn "crm.example.org"
    next
end
config firewall addrgrp
    edit "GRP-INTERNAL"
        set member "SRV-MAIL" "NET-BRANCH"
    next
end
config firewall service custom
    edit "SMTP-MSA"
        set tcp-portrange 587
    next
    edit "SYSLOG-UDP"
        set udp-portrange 514
    next
end
config firewall service group
    edit "GRP-MAIL"
        set member "SMTP-MSA"
    next
end
config firewall vip
    edit "VIP-MAIL"
        set extip 198.18.0.25
        set mappedip "10.70.5.25"
        set extintf "port1"
        set portforward enable
        set protocol tcp
        set extport 25
        set mappedport 25
    next
end
config firewall ippool
    edit "SNAT-POOL"
        set startip 198.18.0.30
        set endip 198.18.0.34
    next
end
config firewall policy
    edit 1
        set name "wan-to-mail"
        set srcintf "Z-WAN"
        set dstintf "Z-LAN"
        set srcaddr "all"
        set dstaddr "VIP-MAIL"
        set service "GRP-MAIL"
        set action accept
        set logtraffic all
    next
    edit 2
        set name "lan-out"
        set srcintf "Z-LAN"
        set dstintf "Z-WAN"
        set srcaddr "GRP-INTERNAL"
        set dstaddr "all"
        set service "ALL"
        set action accept
        set nat enable
        set ippool enable
        set poolname "SNAT-POOL"
        set comments "outbound with pool"
    next
    edit 3
        set name "deny-any"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set action deny
        set logtraffic all
    next
end
config router static
    edit 1
        set gateway 198.18.0.254
        set device "port1"
    next
    edit 2
        set dst 10.90.0.0 255.255.0.0
        set gateway 10.70.0.254
        set device "port2"
        set distance 10
    next
end
config vpn ipsec phase1-interface
    edit "to-branch"
        set interface "port1"
        set remote-gw 203.0.113.99
    next
end
end
